    mode: read
  clients:
    helper: /usr/libexec/mrouter-clients
    mode: readwrite
  client-action:
    helper: /usr/libexec/mrouter-client-action
    mode: write
  wireless:
    helper: /usr/libexec/mrouter-wireless
    mode: readwrite
  networks:
    helper: /usr/libexec/mrouter-networks
    mode: readwrite
  events:
    helper: /usr/libexec/mrouter-events
    mode: readwrite
  wan:
    helper: /usr/libexec/mrouter-wan
    mode: readwrite
  dhcp:
    helper: /usr/libexec/mrouter-dhcp
    mode: readwrite
  firewall:
    helper: /usr/libexec/mrouter-firewall
    mode: readwrite
  support:
    helper: /usr/libexec/mrouter-support
    mode: readwrite
  adguard:
    helper: /usr/libexec/mrouter-adguard
    mode: readwrite
  status-adguard:
    helper: /usr/libexec/mrouter-status-adguard
    mode: read
  tailscale:
    helper: /usr/libexec/mrouter-tailscale
    mode: readwrite
  status-tailscale:
    helper: /usr/libexec/mrouter-status-tailscale
    mode: read
  wireguard:
    helper: /usr/libexec/mrouter-wireguard
    mode: readwrite
  status-wireguard:
    helper: /usr/libexec/mrouter-status-wireguard
    mode: read
  wireguard-client:
    helper: /usr/libexec/mrouter-wireguard-client
    mode: readwrite
  status-wireguard-client:
    helper: /usr/libexec/mrouter-status-wireguard-client
    mode: read
  openvpn:
    helper: /usr/libexec/mrouter-openvpn
    mode: readwrite
  status-openvpn:
    helper: /usr/libexec/mrouter-status-openvpn
    mode: read
  policy:
    helper: /usr/libexec/mrouter-policy
    mode: readwrite
  status-policy:
    helper: /usr/libexec/mrouter-status-policy
    mode: read
  ddns:
    helper: /usr/libexec/mrouter-ddns
    mode: readwrite
  status-ddns:
    helper: /usr/libexec/mrouter-status-ddns
