  ports:
    helper: /usr/libexec/mrouter-ports
    mode: readwrite
  status-ports:
    helper: /usr/libexec/mrouter-status-ports
    mode: read
  parental:
    helper: /usr/libexec/mrouter-parental
    mode: readwrite
  status-parental:
    helper: /usr/libexec/mrouter-status-parental
    mode: read
  content-filter:
    helper: /usr/libexec/mrouter-content-filter
    mode: readwrite
  status-content-filter:
    helper: /usr/libexec/mrouter-status-content-filter
    mode: read
  status-health:
    helper: /usr/libexec/mrouter-status-health
    mode: read
  services:
    helper: /usr/libexec/mrouter-services
    mode: readwrite
  terminal:
    helper: /usr/libexec/mrouter-terminal
    mode: readwrite
  advanced:
    helper: /usr/libexec/mrouter-advanced
    mode: readwrite
  ui-config:
    helper: /usr/libexec/mrouter-ui-config
    mode: readwrite
  upload:
    helper: /usr/libexec/mrouter-upload
    mode: write
security:
  arbitrary_helpers: false
  arbitrary_shell: false
  arguments_are_literal: true
  helper_must_be_registered: true
