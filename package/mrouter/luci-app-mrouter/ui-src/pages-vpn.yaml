version: 1
pages:
  vpn-dashboard:
    title: VPN Dashboard
    subtitle: Remote access, provider tunnels and routing policy at a glance
    sources:
      openvpn: { service: status-openvpn, action: status, parser: pipe, fields: [configured, connected, profile, remote, protocol, device, vpn_ip, rx, tx, credentials] }
      wireguard: { service: status-wireguard, action: status, parser: pipe, fields: [configured, running, public_key, port, address, endpoint, clients] }
      wgclients: { service: status-wireguard-client, action: status, parser: pipe, fields: [profiles] }
      tailscale: { service: status-tailscale, action: status, parser: pipe, fields: [enabled, service, connected, backend, ip, account, tailnet, hostname, lan, unused1, unused2, adv_lan, unused3, unused4, run_exit, snat, accept_routes, accept_dns, exit_node, auth_url] }
      policy: { service: status-policy, action: status, parser: pipe, fields: [enabled, policies, targets, engine, groups, runtime] }
    layout:
    - type: stats
      items:
      - { label: OpenVPN configured, value_from: openvpn.configured }
      - { label: OpenVPN connected, value_from: openvpn.connected }
      - { label: WireGuard remote access, value_from: wireguard.running }
      - { label: Remote clients, value_from: wireguard.clients }
      - { label: WireGuard VPN profiles, value_from: wgclients.profiles }
      - { label: Tailscale state, value_from: tailscale.backend }
      - { label: Policy Routing, value_from: policy.enabled }
      - { label: Routing policies, value_from: policy.policies }
    - type: link
      title: OpenVPN
      text: Import provider profiles, save provider credentials and control the active OpenVPN tunnel.
      label: Manage OpenVPN
      href: /cgi-bin/luci/admin/vpn/openvpn
    - type: link
      title: WireGuard
      text: Configure remote-access clients and outbound WireGuard provider profiles.
      label: Manage WireGuard
      href: /cgi-bin/luci/admin/vpn/wireguard
    - type: link
      title: Tailscale
      text: Join the tailnet, advertise the LAN and configure exit-node behaviour.
      label: Manage Tailscale
      href: /cgi-bin/luci/admin/vpn/tailscale
    - type: link
      title: Policy Routing
      text: Decide which clients and destinations use WAN or a VPN tunnel.
      label: Manage Routing Policies
      href: /cgi-bin/luci/admin/vpn/policy-routing

  openvpn:
    title: OpenVPN
    subtitle: Provider profiles, credentials and tunnel control
    sources:
      status: { service: openvpn, action: status, parser: pipe, fields: [configured, connected, profile, remote, protocol, device, vpn_ip, rx, tx, credentials] }
    layout:
    - type: stats
      items:
      - { label: Configured, value_from: status.configured }
      - { label: Connected, value_from: status.connected }
      - { label: Selected profile, value_from: status.profile }
      - { label: Remote, value_from: status.remote }
      - { label: Protocol, value_from: status.protocol }
      - { label: VPN address, value_from: status.vpn_ip }
      - { label: Credentials saved, value_from: status.credentials }
    - type: notice
      visible_if: { source: status, path: configured, equals: '0' }
      text: No OpenVPN configuration is imported. Import a provider configuration to enable connection controls.
    - type: records
      title: Imported Profiles
      source: status
      tags: [PROFILE]
      columns: [Profile]
      row_actions:
      - { label: Use Profile, service: openvpn, action: select, args: [$row.0], style: primary, reload: true }
      empty: No profiles imported.
    - type: upload
      title: Import VPN Configuration
      text: Import .ovpn, .conf, .zip, .tar.gz or .tgz supplied by your VPN provider. Uploading is handled directly by Mrouter; the old LuCI upload dialog is not used.
      label: Import Configuration
      accept: '.ovpn,.conf,.zip,.tar.gz,.tgz'
      service: openvpn
      action: import
      reload: true
    - type: actions
      title: Connect
      visible_if: { source: status, path: configured, equals: '1' }
      items:
      - { label: Connect, service: openvpn, action: connect, style: primary, reload: true }
      - { label: Disconnect, service: openvpn, action: disconnect, style: secondary, reload: true }
    - type: form
      title: Provider Credentials
      fields:
      - { id: username, type: text, label: Username, help: Leave both fields blank to clear saved credentials. }
      - { id: password, type: password, label: Password }
      actions:
      - { label: Save Credentials, service: openvpn, action: credentials, args: [$field.username, $field.password], style: primary, reload: true }
    - type: actions
      title: Imported Data
      visible_if: { source: status, path: configured, equals: '1' }
      items:
      - { label: Remove Imported Profiles, service: openvpn, action: remove, style: danger, confirm: 'Remove all imported OpenVPN profiles?', reload: true }

  wireguard:
    title: WireGuard
    subtitle: Remote-access server and outbound provider tunnels
    sources:
      server: { service: wireguard, action: status, parser: pipe, fields: [configured, running, public_key, port, address, endpoint, client_count] }
      clients: { service: wireguard-client, action: status, parser: pipe, fields: [profile_count] }
    layout:
    - type: stats
      items:
      - { label: Remote access configured, value_from: server.configured }
      - { label: Remote access running, value_from: server.running }
      - { label: UDP port, value_from: server.port }
      - { label: Server address, value_from: server.address }
      - { label: Public endpoint, value_from: server.endpoint }
      - { label: Remote clients, value_from: server.client_count }
      - { label: Outbound VPN profiles, value_from: clients.profile_count }
    - type: form
      title: Add Remote-Access Client
      fields:
      - { id: endpoint, type: text, label: Public endpoint, default_from: server.endpoint, help: Public IP or hostname used by the remote device. }
      - { id: full, type: toggle, label: Route all client Internet traffic through Mrouter, default: true }
      - { id: name, type: text, label: Client name, placeholder: iPhone }
      actions:
      - { label: Generate Client, service: wireguard, action: generate, args: [$field.endpoint, $field.full, $field.name], style: primary, output: true }
    - type: records
      title: Remote Clients
      source: server
      tags: [CLIENT]
      columns: [Client ID, Name]
      row_actions:
      - { label: View Config, service: wireguard, action: view, args: [$row.0], output: true, style: secondary }
      - { label: Revoke, service: wireguard, action: revoke, args: [$row.0], style: danger, confirm: 'Revoke this WireGuard remote-access client?', reload: true }
      empty: No remote-access clients yet.
    - type: actions
      title: Remote Access Server
      visible_if: { source: server, path: configured, equals: '1' }
      items:
      - { label: Restart Server, service: wireguard, action: restart, style: secondary, reload: true }
    - type: records
      title: Outbound VPN Profiles
      source: clients
      tags: [PROFILE]
      columns: [ID, Name, Interface, Enabled, Connected, Healthy, Handshake age, Endpoint, Address, DNS, RX, TX, Full tunnel]
      row_actions:
      - { label: Connect, service: wireguard-client, action: connect, args: [$row.0], style: primary, reload: true }
      - { label: Disconnect, service: wireguard-client, action: disconnect, args: [$row.0], style: secondary, reload: true }
      - { label: Delete, service: wireguard-client, action: delete, args: [$row.0], style: danger, confirm: 'Delete this WireGuard VPN profile?', reload: true }
      empty: No outbound WireGuard profiles imported.
    - type: upload
      title: Import Outbound WireGuard Profile
      text: Import a standard provider .conf. Mrouter keeps WAN as the default route; Policy Routing chooses who uses the tunnel.
      label: Import WireGuard .conf
      accept: '.conf'
      service: wireguard-client
      action: import
      reload: true
    - type: form
      title: Rename Outbound Profile
      visible_if: { source: clients, tag: PROFILE, exists: true }
      fields:
      - id: profile
        type: select
        label: Profile
        options_from: { source: clients, tags: [PROFILE], value_index: 0, label_index: 1 }
      - { id: name, type: text, label: New name }
      actions:
      - { label: Rename Profile, service: wireguard-client, action: rename, args: [$field.profile, $field.name], style: secondary, reload: true }

  tailscale:
    title: Tailscale
    subtitle: Tailnet connection, LAN route and exit-node settings
    sources:
      status: { service: tailscale, action: status, parser: pipe, fields: [enabled, service, connected, backend, ip, account, tailnet, hostname, lan, unused1, unused2, adv_lan, unused3, unused4, run_exit, snat, accept_routes, accept_dns, exit_node, auth_url] }
    layout:
    - type: stats
      items:
      - { label: Connection state, value_from: status.backend }
      - { label: Tailscale IP, value_from: status.ip }
      - { label: Tailnet, value_from: status.tailnet }
      - { label: Account, value_from: status.account }
      - { label: LAN route, value_from: status.lan }
      - { label: Exit node, value_from: status.exit_node }
    - type: notice
      visible_if: { source: status, path: backend, equals: NeedsLogin }
      text: Sign-in is required. Generate a login link below, authenticate with Tailscale, then complete setup.
    - type: actions
      title: Connection
      items:
      - { label: Get Sign-in Link, service: tailscale, action: bind, style: primary, output: true }
      - { label: Complete Sign-in, service: tailscale, action: finalize, style: secondary, reload: true }
      - { label: Disconnect, service: tailscale, action: disable, style: danger, confirm: 'Disconnect Mrouter-OS from Tailscale?', reload: true }
    - type: link
      title: Tailscale Sign-in
      text: Open the authentication page returned by Tailscale.
      label: Open Tailscale Login
      href_from: status.auth_url
      external: true
    - type: form
      title: Router Settings
      fields:
      - { id: run_exit, type: toggle, label: Advertise this router as an exit node, default_from: status.run_exit }
      - { id: snat, type: toggle, label: IP masquerading for advertised routes, default_from: status.snat }
      - { id: custom_exit, type: toggle, label: Use another Tailscale device as exit node, default: false }
      - { id: exit_node, type: text, label: Exit node device / IP, default_from: status.exit_node }
      actions:
      - { label: Apply Router Settings, service: tailscale, action: apply, args: [$field.run_exit, $field.snat, '0', $field.custom_exit, $field.exit_node], style: primary, reload: true }
    - { type: notice, text: Mrouter advertises only the LAN subnet. IoT stays isolated; accept-routes and Tailscale DNS remain off to avoid route and DNS conflicts. }

  policy:
    sources:
      status: { service: policy, action: status, parser: pipe, fields: [enabled, policies, targets, engine, groups, runtime] }
    layout:
    - type: stats
      items:
      - { label: Policy Routing enabled, value_from: status.enabled }
      - { label: Policies, value_from: status.policies }
      - { label: Targets, value_from: status.targets }
      - { label: Client groups, value_from: status.groups }
      - { label: Engine, value_from: status.engine }
    - { type: records, title: Routing Targets, source: status, tags: [TARGET], columns: [Target, Label, Up] }
    - type: records
      title: Client Groups
      source: status
      tags: [GROUP]
      columns: [ID, Name, MAC addresses]
      row_actions:
      - { label: Delete Group, service: policy, action: group-delete, args: [$row.0], style: danger, confirm: 'Delete this policy group?', reload: true }
    - type: records
      title: Policies
      source: status
      tags: [POLICY]
      columns: [ID, Name, Current target, Source, Destination, Enabled, Source type, Source value, Destination type, Destination value, Desired target, Fail mode, Fallback, Schedule, Days, Window]
      row_actions:
      - { label: Enable, service: policy, action: toggle, args: [$row.0, '1'], style: primary, reload: true }
      - { label: Disable, service: policy, action: toggle, args: [$row.0, '0'], style: secondary, reload: true }
      - { label: Up, service: policy, action: move, args: [$row.0, up], style: secondary, reload: true }
      - { label: Down, service: policy, action: move, args: [$row.0, down], style: secondary, reload: true }
      - { label: Delete, service: policy, action: delete, args: [$row.0], style: danger, confirm: 'Delete this routing policy?', reload: true }
    - type: form
      title: Add Policy
      fields:
      - { id: name, type: text, label: Policy name }
      - { id: source_type, type: select, label: Applies to, options: [{value: all, label: All clients}, {value: devices, label: Selected devices / MACs}, {value: group, label: Client group}, {value: iot, label: IoT clients}, {value: wgremote, label: WireGuard remote clients}, {value: tailscale, label: Tailscale clients}, {value: subnet, label: Subnet}] }
      - { id: source_value, type: text, label: Source value, help: Device MACs, group ID or subnet when required. }
      - { id: dest_type, type: select, label: Destination, options: [{value: all, label: Everything}, {value: custom, label: Domains / IPs}, {value: exclude, label: Everything except}, {value: service, label: Service}, {value: country, label: Country}, {value: subscription, label: Subscription list}] }
      - { id: dest_value, type: text, label: Destination value }
      - id: target
        type: select
        label: Route through
        options_from: { source: status, tags: [TARGET], value_index: 0, label_index: 1 }
      - { id: fail, type: select, label: If tunnel unavailable, options: [{value: block, label: Block traffic}, {value: wan, label: Use WAN}, {value: other, label: Use fallback VPN}] }
      - id: fallback
        type: select
        label: Fallback VPN
        options_from: { source: status, tags: [TARGET], value_index: 0, label_index: 1, prepend: { value: '', label: None } }
      - { id: schedule, type: select, label: Schedule, options: [always, weekdays, weekends, custom] }
      - { id: days, type: text, label: Custom days, placeholder: '1,2,3,4,5' }
      - { id: start, type: text, label: Start, default: '00:00' }
      - { id: end, type: text, label: End, default: '23:59' }
      actions:
      - { label: Add Policy, service: policy, action: add, args: [$field.name, $field.source_type, $field.source_value, $field.dest_type, $field.dest_value, $field.target, $field.fail, $field.fallback, $field.schedule, $field.days, $field.start, $field.end], style: primary, reload: true }
    - type: form
      title: Create Client Group
      fields:
      - { id: name, type: text, label: Group name }
      - { id: macs, type: textarea, label: Client MAC addresses, help: Shared device picker is being added; comma or space separated addresses remain available for now. }
      actions:
      - { label: Create Group, service: policy, action: group-add, args: [$field.name, $field.macs], reload: true }
    - type: form
      title: Test Routing Decision
      fields:
      - { id: mac, type: text, label: Client MAC }
      - { id: ip, type: text, label: Client IP }
      - { id: dest, type: text, label: Destination }
      actions:
      - { label: Test Route, service: policy, action: test, args: [$field.mac, $field.ip, $field.dest], output: true, style: secondary }
    - type: actions
      title: Policy Service
      items:
      - { label: Enable Policy Routing, service: policy, action: service, args: ['1'], style: primary, reload: true }
      - { label: Disable Policy Routing, service: policy, action: service, args: ['0'], style: secondary, reload: true }
      - { label: Refresh State, service: policy, action: reconcile, style: secondary, reload: true }
