version: 1
schema:
  page_renderers:
    - yaml
  block_types:
    - heading
    - notice
    - stats
    - card
    - records
    - json
    - code
    - form
    - actions
    - link
    - topology
    - port-grid
    - client-list
    - event-list
    - wireless-panel
    - dhcp-panel
  field_types:
    - text
    - password
    - number
    - select
    - toggle
    - textarea
    - yaml
    - colour
  safety:
    arbitrary_javascript: false
    arbitrary_shell: false
    html_from_yaml: false
    backend_actions_must_use_registry: true
    legacy_views_allowed: false
    href_prefix: /cgi-bin/luci/
  runtime:
    defaults: /usr/share/mrouter/ui/defaults
    overrides: /etc/mrouter/ui.d
    generated_web: /www/luci-static/mrouter-ui
